name: Sync upstream tags

# Mirrors new release tags from l0ng-ai/openidea into this fork and builds the
# newest one (which is where the portable exe is produced). Scheduled runs poll
# upstream twice an hour, and every push to main checks too: GitHub does not run
# scheduled workflows in a fork until they are enabled by hand and delays them
# for hours after changes. Trigger this workflow manually to force a check, or
# run Release (workflow_dispatch) with a specific tag to build an older one.
#
# Mirroring the tag refs needs a personal access token in the SYNC_TOKEN secret
# (Contents: read and write): the default GITHUB_TOKEN is not allowed to create
# git references. Building does not depend on it — Release creates the tag
# itself through the releases API.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  # Lets a token with only `repo` scope (no `workflow` scope) kick a check:
  # POST /repos/<owner>/<repo>/dispatches {"event_type": "sync-upstream"}
  repository_dispatch:
    types: [sync-upstream]

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror upstream tags
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.tags.outputs.build_tag }}
      build_sha: ${{ steps.tags.outputs.build_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow is fine: tags are created through the API, not fetched.
          fetch-depth: 1
      - name: Find new upstream tags
        id: tags
        env:
          UPSTREAM: https://github.com/l0ng-ai/openidea.git
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          refs() {
            git ls-remote --tags "$1" \
              | awk '{ ref = $2; if (ref !~ /\^\{\}$/) { sub(/^refs\/tags\//, "", ref); print ref } }' \
              | sort -u
          }
          refs "$UPSTREAM" > upstream-tags.txt
          refs origin > own-tags.txt
          comm -23 upstream-tags.txt own-tags.txt > missing-tags.txt
          if [ -s missing-tags.txt ]; then
            echo "New upstream tags:"
            cat missing-tags.txt
            # Mirror each tag with the REST API instead of `git push`: GITHUB_TOKEN
            # may not push commits that touch .github/workflows, and upstream tags
            # point at such commits. Their commits already live in this fork's
            # history, so creating the ref is all it takes (upstream's annotated
            # tags become lightweight ones pointing at the same commit).
            AUTH="${SYNC_TOKEN:-$GITHUB_TOKEN}"
            while read -r tag; do
              sha="$(git ls-remote "$UPSTREAM" "refs/tags/$tag^{}" | awk '{print $1}')"
              [ -n "$sha" ] || sha="$(git ls-remote "$UPSTREAM" "refs/tags/$tag" | awk '{print $1}')"
              code="$(curl -s -o resp.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $AUTH" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs" \
                -d "{\"ref\":\"refs/tags/$tag\",\"sha\":\"$sha\"}")"
              if [ "$code" = 201 ]; then
                echo "created $tag -> $sha"
              elif grep -q 'Reference already exists' resp.json; then
                echo "$tag already present"
              else
                echo "::warning::could not mirror $tag (HTTP $code): $(cat resp.json)"
              fi
            done < missing-tags.txt
          else
            echo "No new upstream tags."
          fi
          # Only the newest upstream v* tag is built, and only when it is new.
          # Older tags are mirrored but never built automatically (run Release's
          # workflow_dispatch for one of those); building creates its ref anyway
          # through the releases API, so a missing mirror never rebuilds a tag.
          latest="$(grep '^v' upstream-tags.txt | sort -V | tail -1 || true)"
          if [ -n "$latest" ] && grep -qxF "$latest" missing-tags.txt; then
            build_tag="$latest"
          else
            build_tag=""
          fi
          build_sha=""
          if [ -n "$build_tag" ]; then
            build_sha="$(git ls-remote "$UPSTREAM" "refs/tags/$build_tag^{}" | awk '{print $1}')"
            [ -n "$build_sha" ] || build_sha="$(git ls-remote "$UPSTREAM" "refs/tags/$build_tag" | awk '{print $1}')"
          fi
          {
            echo "build_tag=$build_tag"
            echo "build_sha=$build_sha"
          } >> "$GITHUB_OUTPUT"
          echo "Building: ${build_tag:-nothing new} @ ${build_sha:-}"

  # Tags are created through the releases API below, and this fork's Release
  # workflow has no `push: tags` trigger (a tag's own commit carries the
  # upstream workflow file without the portable exe step, so building from it
  # would drop it silently). The build is driven here through workflow_call,
  # which always runs this fork's current Release workflow.
  release:
    name: Release ${{ needs.sync.outputs.build_tag }}
    needs: sync
    if: needs.sync.outputs.build_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.sync.outputs.build_tag }}
      sha: ${{ needs.sync.outputs.build_sha }}
    secrets: inherit
