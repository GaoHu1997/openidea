name: Sync upstream tags

# Mirrors new release tags from l0ng-ai/openidea into this fork and builds the
# newest one (which is where the portable exe is produced). Scheduled runs poll
# upstream twice an hour; GitHub delays scheduled workflows during busy periods,
# so "up to date within roughly an hour" is the realistic guarantee. Trigger
# this workflow manually to force a check, or run Release (workflow_dispatch)
# with a specific tag to build an older one that was only mirrored.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror upstream tags
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.tags.outputs.build_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow is fine: each tag is fetched individually from upstream.
          fetch-depth: 1
      - name: Find new upstream tags
        id: tags
        env:
          UPSTREAM: https://github.com/l0ng-ai/openidea.git
        run: |
          refs() {
            git ls-remote --tags "$1" \
              | awk '{ ref = $2; if (ref !~ /\^\{\}$/) { sub(/^refs\/tags\//, "", ref); print ref } }' \
              | sort -u
          }
          refs "$UPSTREAM" > upstream-tags.txt
          refs origin > own-tags.txt
          comm -23 upstream-tags.txt own-tags.txt > missing-tags.txt
          if [ -s missing-tags.txt ]; then
            echo "New upstream tags:"
            cat missing-tags.txt
            while read -r tag; do
              git fetch --no-tags "$UPSTREAM" "refs/tags/$tag:refs/tags/$tag"
              git push origin "refs/tags/$tag"
            done < missing-tags.txt
          else
            echo "No new upstream tags."
          fi
          # Only the newest new v* tag gets built here. A first run can see every
          # historical tag at once; the rest stay mirrored and an older one can be
          # built on demand through Release's workflow_dispatch.
          build_tag="$(grep '^v' missing-tags.txt | sort -V | tail -1 || true)"
          echo "build_tag=$build_tag" >> "$GITHUB_OUTPUT"
          echo "Building: ${build_tag:-nothing new}"

  # The default GITHUB_TOKEN pushing a tag above does not trigger Release's
  # `push` tag trigger (events from GITHUB_TOKEN never start workflows), so the
  # build is driven here through workflow_call instead. This also avoids a
  # double build if a PAT ever pushes the same tag.
  release:
    name: Release ${{ needs.sync.outputs.build_tag }}
    needs: sync
    if: needs.sync.outputs.build_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.sync.outputs.build_tag }}
    secrets: inherit
