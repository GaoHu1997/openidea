name: Release
on:
  # No `push: tags` trigger: a tag's own commit carries the upstream workflow
  # file without the portable exe step, so building from it would drop it
  # silently. Every build runs from this branch — driven by sync-upstream.yml
  # (workflow_call) or by hand (workflow_dispatch).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0); must already exist"
        required: true
  # Called by sync-upstream.yml once it has mirrored a new upstream tag here.
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0); must already exist"
        required: true
        type: string
      sha:
        description: "Commit the tag points at; lets create-release make the tag if it is not mirrored yet"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag || github.ref_name }}
  SHA: ${{ inputs.sha }}

jobs:
  # Creates (or reuses) the release every build uploads into. Reusing an
  # already-published release keeps manual re-runs able to repair its assets.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA || env.TAG }}" }
      - name: Tag matches app version
        run: |
          app="v$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$app" != "$TAG" ]; then
            echo "::error::tag $TAG does not match tauri.conf.json version $app"
            exit 1
          fi
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG;
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) {
              if (!existing.draft) core.notice(`release ${tag} is already published; re-uploading assets into it`);
              core.setOutput("id", existing.id);
              return;
            }
            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: `OpenIDEA ${tag}`,
              target_commitish: process.env.SHA || undefined,
              draft: true, prerelease: tag.includes("-"), generate_release_notes: true,
            });
            core.setOutput("id", data.id);

  # This fork ships portable exes only — no installers, no other platforms.
  build:
    needs: create-release
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Windows arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA || env.TAG }}" }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: pnpm install --frozen-lockfile
      # `--no-bundle` builds the app binary only: no installers — and no updater
      # artifacts either, which is what used to demand upstream's private signing
      # key and fail every platform.
      - name: Build
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle

      # Portable build (no installer): the bare main binary, which embeds the
      # frontend, so it runs as a single self-contained exe. Only the WebView2
      # Runtime must be present (preinstalled on Windows 10 1803+ / Windows 11).
      - name: Portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            x86_64-*) arch=x64 ;;
            aarch64-*) arch=arm64 ;;
            *) echo "::error::no portable artifact arch for $TARGET"; exit 1 ;;
          esac
          name="OpenIDEA_${TAG#v}_${arch}-portable.exe"
          cp "target/$TARGET/release/openidea.exe" "$name"
          sha256sum "$name" > "$name.sha256"
          gh release upload "$TAG" "$name" "$name.sha256" --clobber

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: Number(process.env.RELEASE_ID), draft: false,
            });
